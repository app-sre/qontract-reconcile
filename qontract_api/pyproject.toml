[project]
name = "qontract-api"
version = "0.1.0"
description = "REST API service for qontract reconciliation"
authors = [{ name = "Red Hat App-SRE Team", email = "sd-app-sre@redhat.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "cachetools==7.1.7",
    "celery==5.6.3",
    "fastapi==0.141.1",
    "faststream[cli,redis,prometheus]==0.7.3",
    "httpx2==2.9.1",
    "prometheus-client==0.26.0",
    "prometheus-fastapi-instrumentator==8.1.0",
    "pydantic-settings==2.14.2",
    "pydantic==2.13.4",
    "python-jose[cryptography]==3.5.0",
    "qontract-api-client",
    "qontract-utils",
    "redis==8.1.0",
    "sentry-sdk==2.66.1",
    "structlog==26.1.0",
    "uvicorn[standard]==0.52.1",
]


[dependency-groups]
dev = [
    # development and testing tools
    "mypy==2.3.0",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest==9.1.1",
    "rich==15.0.0",
    "ruff==0.16.1",
    "types-cachetools==7.0.0.20260713",
    "types-hvac==2.4.0.20260731",
    "types-python-jose==3.5.0.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qontract_api"]

[tool.ruff]
line-length = 88
src = ["qontract_api", "tests"]
fix = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true
select = ["ALL"]
ignore = [
    "any-type",                            # allow typings.Any
    "async-function-with-timeout",         # Async function with timeout parameter (false positive for FastAPI Query params)
    "CPY",                                 # Missing copyright header
    "undocumented-public-module",          # Missing docstring in public module
    "undocumented-public-class",           # Missing docstring in public class
    "undocumented-public-method",          # Missing docstring in public method
    "undocumented-public-function",        # Missing docstring in public function
    "undocumented-public-package",         # Missing docstring in public package
    "undocumented-magic-method",           # Missing docstring in magic method
    "undocumented-public-nested-class",    # Missing docstring in nested public class
    "undocumented-public-init",            # Missing docstring in __init__
    "incorrect-blank-line-before-class",   # 1 blank line required before class docstring
    "blank-line-before-class",             # No blank lines allowed before class docstring
    "multi-line-summary-first-line",       # multi-line-summary-first-line
    "multi-line-summary-second-line",      # multi-line-summary-second-line
    "D4",                                  # Doc string style
    "line-too-long",                       # Line too long
    "line-contains-todo",                  # TODO comment found
    "logging-f-string",                    # Logging statement uses f-string
    "too-many-public-methods",             # Too many public methods
    "too-many-arguments",                  # Too many arguments
    "too-many-positional-arguments",       # Too many positional arguments
    "non-empty-init-module",               # `__init__` module should only contain docstrings and re-exports
    "assert",                              # Use of assert detected. Pytest uses assert
    "suspicious-subprocess-import",        # subprocess import
    "raw-string-in-exception",             # Exception must not use a string literal, assign to variable first
    "f-string-in-exception",               # Exception must not use an f-string literal, assign to variable first
    "raise-vanilla-args",                  # Avoid specifying long messages outside the exception class
    "try-consider-else",                   # try-consider-else
    "typing-only-third-party-import",      # type-checking-block
    "typing-only-standard-library-import", # type-checking-block
    # pydoclint
    "DOC",
    # May conflict with the formatter, https://docs.astral.sh/ruff/formatter/#conflicting-lint-rules
    "tab-indentation",
    "indentation-with-invalid-multiple",
    "indentation-with-invalid-multiple-comment",
    "over-indented",
    "docstring-tab-indentation",
    "triple-single-quotes",
    "Q",
    "missing-trailing-comma",
    "prohibited-trailing-comma",
    "single-line-implicit-string-concatenation",
    # remove me
    "TD", # TODO found
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "unused-function-argument",               # Unused argument (common in test fixtures)
    "boolean-type-hint-positional-argument",  # Boolean positional args acceptable in parametrized tests
    "import-outside-top-level",               # Import not at top level (lazy imports in tests)
    "magic-value-comparison",                 # Magic value in comparison (acceptable in tests)
    "compare-to-empty-string",                # xxx == "" (common in tests for empty string checks)
    "import-private-name",                    # import from private module (testing internal state)
    "no-self-use",                            # Method could be function/classmethod/staticmethod (pytest uses instance methods)
    "pytest-raises-with-multiple-statements", # pytest.raises with multiple statements (acceptable pattern)
    "pytest-raises-ambiguous-pattern",        # Regex metacharacters in pytest.raises match (intentional in tests)
    "hardcoded-password-string",              # Possible hardcoded password assigned (test fixtures)
    "hardcoded-password-func-arg",            # Possible hardcoded password (test fixtures use hardcoded values)
    "private-member-access",                  # Private member access (testing internal state)
]
[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
    "pydantic.validate_call",
    "fastapi.FastAPI.get",
    "fastapi.FastAPI.post",
    "fastapi.FastAPI.put",
    "fastapi.FastAPI.delete",
    "fastapi.APIRouter.get",
    "fastapi.APIRouter.post",
    "fastapi.APIRouter.put",
    "fastapi.APIRouter.delete",
]

[tool.ruff.lint.isort]
known-first-party = ["qontract_api"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.mypy]
files = ["qontract_api", "tests"]
plugins = ["pydantic.mypy"]
# More context here: https://github.com/python/mypy/issues/9091
# Ensure that methods without type definitions are still checked
# Ensure that ignore statements that are no longer doing anything are detected for cleanup
# Enable error codes in Mypy so that specific error codes can be ignored if needed
# Ensure that Python type hints have been defined
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Below are all of the packages that don't implement stub packages. Mypy will throw an error if we don't ignore the
# missing imports. See: https://mypy.readthedocs.io/en/stable/running_mypy.html#missing-imports
module = ["celery.*", "jose", "billiard.einfo.*", "kombu.*"]
ignore_missing_imports = true

# [tool.coverage.report]
# fail_under = 90
