# qenerate: plugin=pydantic_v2

fragment SaasTargetNamespace on Namespace_v1 {
  name
  labels
  delete
  path
  environment {
    name
    labels
    parameters
    secretParameters {
      name
      secret {
        ...VaultSecret
      }
    }
  }
  app {
    name
    parentApp {
      name
    }
    labels
    selfServiceRoles {
      name
    }
    serviceOwners {
      name
      email
    }
    codeComponents {
      url
      blockedVersions
      hotfixVersions
    }
  }
  cluster {
    name
    serverUrl
    internal
    insecureSkipTLSVerify
    labels
    # SaaS deployments pass this cluster to OC_Map through SaasHerder.
    automationToken {
      ...VaultSecret
    }
    automationTokens {
      name
      namespace
      active
      delete
      secret {
        ...VaultSecret
      }
    }
    clusterAdminAutomationToken {
      ...VaultSecret
    }
    clusterAdminAutomationTokens {
      name
      namespace
      active
      delete
      secret {
        ...VaultSecret
      }
    }
    disable {
      integrations
    }
    spec {
      region
    }
    externalConfiguration {
      labels
    }
  }
  skupperSite {
    delete
  }
}
