# qenerate: plugin=pydantic_v2

fragment SaasTargetNamespace on Namespace_v1 {
  name
  labels
  delete
  path
  environment {
    name
    labels
    parameters
    secretParameters {
      name
      secret {
        ...VaultSecret
      }
    }
  }
  app {
    name
    parentApp {
      name
    }
    labels
    selfServiceRoles {
      name
    }
    serviceOwners {
      name
      email
    }
    codeComponents {
      url
      blockedVersions
      hotfixVersions
    }
  }
  cluster {
    name
    serverUrl
    internal
    insecureSkipTLSVerify
    labels
    # APPSRE-13941: automationTokens/clusterAdminAutomationTokens (lists)
    # intentionally omitted here. Audited 2026-10-01: none of this
    # fragment's consumers (typed_queries/saas_files.py,
    # saas_auto_promotions_manager/subscriber.py and .../renderer.py)
    # build an OC/K8s connection from this field. If that changes, add
    # the lists here too.
    automationToken {
      ...VaultSecret
    }
    clusterAdminAutomationToken {
      ...VaultSecret
    }
    disable {
      integrations
    }
    spec {
      region
    }
    externalConfiguration {
      labels
    }
  }
  skupperSite {
    delete
  }
}
