# qenerate: plugin=pydantic_v2

query OcmGroupsApiRoles {
  roles: roles_v1 {
    name
    users {
      ...User
    }
    memberSources {
      ...RoleMembershipSource
    }
    expirationDate
    access {
      cluster {
        name
        auth {
          service
        }
      }
      group
    }
  }
}
