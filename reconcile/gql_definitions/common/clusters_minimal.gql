# qenerate: plugin=pydantic_v2

query ClustersMinimal($name: String) {
  clusters: clusters_v1(name: $name) {
    name
    serverUrl
    consoleUrl
    prometheusUrl
    insecureSkipTLSVerify
    managedGroups
    ocm {
      name
    }
    spec {
      private
    }
    automationToken {
      ...VaultSecret
    }
    automationTokens {
      name
      namespace
      active
      delete
      secret {
        ...VaultSecret
      }
    }
    clusterAdmin
    clusterAdminAutomationToken {
      ...VaultSecret
    }
    clusterAdminAutomationTokens {
      name
      namespace
      active
      delete
      secret {
        ...VaultSecret
      }
    }
    internal
    disable {
      integrations
    }
    auth {
      service
      ... on ClusterAuthGithubOrg_v1 {
        org
      }
      ... on ClusterAuthGithubOrgTeam_v1 {
        org
        team
      }
      ... on ClusterAuthOIDC_v1 {
        name
      }
      ... on ClusterAuthRHIDP_v1 {
        name
      }
    }
  }
}
