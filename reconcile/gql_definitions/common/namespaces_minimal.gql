# qenerate: plugin=pydantic_v2

query NamespacesMinimal {
  namespaces: namespaces_v1 {
    name
    delete
    labels
    clusterAdmin
    managedByExternal
    cluster {
      name
      serverUrl
      insecureSkipTLSVerify
      automationToken {
        ...VaultSecret
      }
      automationTokens {
        name
        namespace
        active
        delete
        secret {
          ...VaultSecret
        }
      }
      clusterAdminAutomationToken {
        ...VaultSecret
      }
      clusterAdminAutomationTokens {
        name
        namespace
        active
        delete
        secret {
          ...VaultSecret
        }
      }
      internal
      disable {
        integrations
      }
    }
  }
}
