# qenerate: plugin=pydantic_v2

query AwsExporterCluster {
  clusters: clusters_v1 {
    name
    prometheusUrl
    automationToken {
      ...VaultSecret
    }
    automationTokens {
      name
      namespace
      active
      delete
      secret {
        ...VaultSecret
      }
    }
    disable {
      integrations
    }
  }
}
