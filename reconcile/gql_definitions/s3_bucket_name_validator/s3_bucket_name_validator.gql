# qenerate: plugin=pydantic_v2

query S3BucketNameValidator {
  namespaces: namespaces_v1 {
    name
    delete
    managedExternalResources
    externalResources {
      provider
      provisioner {
        name
      }
      ... on NamespaceTerraformProviderResourceAWS_v1 {
        resources {
          provider
          identifier
        }
      }
    }
  }
}
