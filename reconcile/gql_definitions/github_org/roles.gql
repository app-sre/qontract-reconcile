# qenerate: plugin=pydantic_v2

query GithubOrgRoles {
  roles: roles_v1 {
    name
    users {
      org_username
      github_username
    }
    bots {
      github_username
    }
    memberSources {
      ...RoleMembershipSource
    }
    permissions {
      ... on PermissionGithubOrgTeam_v1 {
        service
        org
        team
      }
    }
    expirationDate
  }
}
