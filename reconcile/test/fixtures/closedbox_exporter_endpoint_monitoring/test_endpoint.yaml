appInterface:
  apps:
  - endPoints:
    - name: test
      description: test
      url: https://httpstat.us/200
      monitoring:
      - provider:
          name: blackbox-exporter-http-2xx
          description: Checks a URL for HTTP 2xx status codes via blackbox-exporter
          provider: blackbox-exporter
          metricLabels: null
          timeout: null
          checkInterval: null
          blackboxExporter:
            module: http_2xx
            namespace:
              name: openshift-customer-monitoring
              cluster:
                name: app-sre-stage-01
                serverUrl: http://asdf:6443
                internal: false
                automationTokens: null
                automationToken:
                  path: app-sre/creds/kube-configs/app-sre-stage-01
                  field: token
                  version: null
            exporterUrl: http://exporterhost:9115/probe
      - provider:
          name: signalfx-exporter-http-2xx
          description: Loads metrics from signalfx
          provider: signalfx
          metricLabels: null
          timeout: null
          checkInterval: null
          signalFx:
            exporterUrl: http://signalfxexporter:9091/metrics
            targetFilterLabel: probe
            namespace:
              name: openshift-customer-monitoring
              cluster:
                name: app-sre-stage-01
                serverUrl: http://asdf:6443
                internal: false
                automationTokens: null
                automationToken:
                  path: app-sre/creds/kube-configs/app-sre-stage-01
                  field: token
                  version: null
      - provider:
          provider: other
          name: other-provider
          description: Unsupported provider
          metricLabels: null
          timeout: null
          checkInterval: null
