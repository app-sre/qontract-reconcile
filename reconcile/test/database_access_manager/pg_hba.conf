# Authentication policy for the database-access-manager E2E containers.
#
# The two fixture roles connect via trust: the bootstrap superuser
# (postgres) and the executor role simulating the RDS master user
# (test_admin, created by the conftest). Every other role must
# authenticate with scram-sha-256 -- password assertions in the E2E
# tests are real verification, not trust shortcuts.
#
# Mounted via `postgres -c hba_file=/dam-e2e/pg_hba.conf` (mounting
# into $PGDATA would make the image entrypoint skip initdb, and the
# data directory moved to a versioned path in PostgreSQL 18).
#
# psql connects via 127.0.0.1 (IPv4); ::1 mirrors the policy for
# completeness.
local   all         all                                     trust
host    all         postgres        127.0.0.1/32            trust
host    all         test_admin      127.0.0.1/32            trust
host    all         all             127.0.0.1/32            scram-sha-256
host    all         postgres        ::1/128                 trust
host    all         test_admin      ::1/128                 trust
host    all         all             ::1/128                 scram-sha-256
