[project]
name = "qontract-reconcile"
dynamic = ["version"]
description = "Collection of tools to reconcile services with their desired state as defined in the app-interface DB."
authors = [{ name = "Red Hat App-SRE Team", email = "sd-app-sre@redhat.com" }]
license = { text = "Apache 2.0" }
readme = "README.md"
requires-python = "==3.14.*"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "anymarkup==0.8.1",
    # keep in sync with boto3-stubs in dependency-groups.type
    "boto3==1.43.123",
    "botocore==1.43.123",
    "Click>=7.0,<9.0",
    "croniter==6.2.4",
    "dateparser==1.4.3",
    "deepdiff==9.1.0",
    "dnspython~=2.1",
    "dt==1.1.73",
    "filetype~=1.2.0",
    "gql==4.4.0",
    "hvac==2.4.0",
    "jenkins-job-builder==6.5.0",
    "Jinja2>=2.10.1,<3.2.0",
    "jira==3.10.5",
    "jsonpatch~=1.33",
    "jsonpath-ng==1.15.0",
    "jsonpointer==3.6",
    "kubernetes==37.0.1",
    "ldap3>=2.9.1,<2.10.0",
    "networkx~=3.6",
    "prometheus-client==0.26.0",
    "psycopg2-binary~=2.9",
    "pydantic~=2.14.2",
    "pygithub==1.59.1",
    "pyjwt~=2.7",
    "pyOpenSSL~=26.2",
    "pypd>=1.1.0,<1.2.0",
    "python-gitlab==6.5.0",
    "requests-oauthlib~=2.0",
    "requests~=2.32",
    "rich==15.0.0",
    "semver~=3.0",
    "sendgrid==6.12.5",
    "sentry-sdk==2.73.0",
    # jenkins-job-builder uses pkg_resources from setuptools. pkg_resources was removed from setuptools in version 82.0.0
    # See https://setuptools.pypa.io/en/latest/history.html#v82-0-0 for more information about the removal of pkg_resources
    # jjb bug report: https://storyboard.openstack.org/#!/story/2011757
    "setuptools<82.0.0",
    "slack_sdk>=3.10,<4.0",
    "sretoolbox==4.0.1",
    "tabulate==0.10.0",
    "terrascript==0.9.0",
    "UnleashClient==6.9.1",
    "urllib3~=2.2",
    "yamllint==1.38.0",
    "qontract-api-client",
    "qontract-utils",
]

[dependency-groups]
debugger = ["debugpy ~=1.8.17"]
dev = [
    # keep in sync project.dependencies.boto3
    "boto3-stubs[accessanalyzer,account,cloudformation,dynamodb,ec2,ecr,elb,iam,logs,opensearch,organizations,rds,route53,s3,service-quotas,sqs,sts,support]==1.43.123",
    "import-linter==2.15",
    "moto[ec2,iam,logs,s3,route53]==5.2.5",
    "mypy==2.4.1",
    "pyfakefs==6.2.0",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1",
    "pytest-cov==7.1.0",
    "pytest-httpserver==1.2.0",
    "pytest-mock==3.17.0",
    "qenerate==0.10.1",
    "responses==0.26.3",
    "ruff==0.17.3",
    "smtpdfix==0.5.3",
    "snakeviz==2.2.2",
    "types-click",
    "types-croniter",
    "types-dateparser",
    "types-Jinja2",
    "types-ldap3",
    "types-mock",
    "types-oauthlib",
    "types-psycopg2",
    "types-pyOpenSSL",
    "types-python-dateutil",
    "types-PyYAML",
    "types-requests-oauthlib",
    "types-requests",
    "types-tabulate",
    "pytest-xdist>=3.8.0",
]

[project.scripts]
app-interface-metrics-exporter = "tools.app_interface_metrics_exporter:main"
app-interface-reporter = "tools.app_interface_reporter:main"
glitchtip-access-reporter = "tools.glitchtip_access_reporter:main"
glitchtip-access-revalidation = "tools.glitchtip_access_revalidation:main"
app-sre-tekton-access-reporter = "tools.app_sre_tekton_access_reporter:main"
app-sre-tekton-access-revalidation = "tools.app_sre_tekton_access_revalidation:main"
qontract-cli = "tools.qontract_cli:root"
qontract-reconcile = "reconcile.cli:integration"
run-integration = "reconcile.run_integration:main"
saas-metrics-exporter = "tools.saas_metrics_exporter.main:main"
template-validation = "tools.template_validation:main"

[project.urls]
homepage = "https://github.com/app-sre/qontract-reconcile"
repository = "https://github.com/app-sre/qontract-reconcile"
documentation = "https://github.com/app-sre/qontract-reconcile"

[tool.uv]
required-version = ">=0.13.7"

[tool.uv.sources]
qontract-api = { workspace = true }
qontract-api-client = { workspace = true }
qontract-utils = { workspace = true }


[tool.uv.workspace]
members = ["qontract_api", "qontract_api_client", "qontract_utils"]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.sdist]
# TODO: package_data={"reconcile": ["templates/*.j2", "gql_queries/*/*.gql"]},
only-include = ["reconcile", "tools"]
exclude = ["*.gql", "**/test/*"]

[tool.hatch.build.targets.wheel]
only-include = ["reconcile", "tools"]
exclude = ["*.gql", "**/test/*"]

[tool.uv-dynamic-versioning]
vcs = "git"
latest-tag = true
# do not add commit hash to version
metadata = false
# do not add dirty flag to version
dirty = false
# version git tag doesn't have a prefix
pattern = "default-unprefixed"
style = "pep440"
# X.Y.(Z+1)
bump = true

[tool.ruff]
line-length = 88
src = ["reconcile", "tools"]
extend-exclude = ["reconcile/gql_definitions"]
fix = true

[tool.ruff.format]
preview = true

[tool.ruff.lint]
preview = true

# defaults are ["E4", "E7", "E9", "F"]
extend-select = [
    # flake8 default rules
    "E1", # preview rule
    "E2", # preview rule
    "W",
    # isort
    "I",
    # pylint
    "PL",
    # pyupgrade
    "UP",
    # flake8-simply
    "SIM",
    # flake8-bugbear
    "B",
    # flake8-comprehensions
    "C4",
    # flake8-future-annotations
    "FA",
    # ruff special rules
    "RUF",
    # flake8-type-checking
    "TC",
    # Perflint
    "PERF",
    # refurb
    "FURB",
    # PEP8
    "N",
    # datetime
    "DTZ",
]
ignore = [
    "constant-imported-as-non-constant", # Constant `xxx` imported as non-constant `xxx`
    "camelcase-imported-as-acronym",     # CamelCase `xxx` imported as acronym `xxx`
    "too-many-public-methods",           # Too many public methods
    "too-many-return-statements",        # Too many return statements
    "too-many-branches",                 # Too many branches
    "too-many-arguments",                # Too many arguments
    "too-many-locals",                   # Too many local variables
    "too-many-statements",               # Too many statements
    "too-many-positional-arguments",     # Too many positional arguments
    "too-many-nested-blocks",            # Too many nested blocks
    "magic-value-comparison",            # Magic value used in comparison
    "no-self-use",                       # Method XXX could be a function, class method, or static method
    "eq-without-hash",                   # Object does not implement `__hash__` method
    "redefined-loop-name",               # `for` loop variable `v` overwritten by assignment target
    "printf-string-formatting",          # Use format specifiers instead of percent format
    "collapsible-if",                    # Use a single `if` statement instead of nested `if` statements
    "assert-raises-exception",           #`pytest.raises(Exception)` should be considered evil
    "collection-literal-concatenation",  # Consider "...."instead of concatenation
    "mutable-class-default",             # Mutable class attributes should be annotated with "typing.ClassVar"
    "non-empty-init-module",             # `__init__` module should only contain docstrings and re-exports
    "too-many-statements-in-try-clause",
    "pytest-fixture-autouse",            # Avoid using `autouse=True` in `pytest.fixture` decorators
    # Review later
    "read-whole-file",     # Replace `open` with `pathlib.Path`
    "write-whole-file",    # Replace `open` with `pathlib.Path`
    "raise-vanilla-class", # Create your own exception class instead of raising `Exception`
    "blind-except",        # Do not catch blind exception: `Exception`
    "root-logger-call",    # call on root logger
]

[tool.ruff.lint.per-file-ignores]
"reconcile/test/**" = [
    "import-outside-top-level",               # Import not at top level (lazy imports in tests)
    "magic-value-comparison",                 # Magic value in comparison (acceptable in tests)
    "no-self-use",                            # Method could be function/classmethod/staticmethod (pytest uses instance methods)
    "pytest-raises-with-multiple-statements", # pytest.raises with multiple statements (acceptable pattern)
    "pytest-raises-ambiguous-pattern",        # Regex metacharacters in pytest.raises match (intentional in tests)
    "float-equality-comparison",              # Unreliable floating point equality comparison
    "hardcoded-password-string",              # Possible hardcoded password assigned (test fixtures)
    "hardcoded-password-func-arg",            # Possible hardcoded password (test fixtures use hardcoded values)
    "private-member-access",                  # Private member access (testing internal state)
]
[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "reconcile.gql_definitions.common.saas_files.ConfiguredBaseModel",
    "reconcile.gql_definitions.integrations.integrations.IntegrationSpecV1",
]
runtime-evaluated-decorators = [
    "dataclasses.dataclass",
    "pydantic.dataclasses.dataclass",
    "pydantic.validate_call",
]

[tool.ruff.lint.isort]
known-first-party = ["reconcile", "tools"]

[tool.ruff.lint.pep8-naming]
classmethod-decorators = ["classmethod"]

[tool.coverage.run]
branch = true
omit = ["*/test/*"]

[tool.coverage.report]
fail_under = 60

[tool.mypy]
files = ["reconcile", "tools"]
plugins = ["pydantic.mypy"]
# More context here: https://github.com/python/mypy/issues/9091
# Ensure that methods without type definitions are still checked
# Ensure that ignore statements that are no longer doing anything are detected for cleanup
# Enable error codes in Mypy so that specific error codes can be ignored if needed
# Ensure that Python type hints have been defined
enable_error_code = ["truthy-bool", "redundant-expr"]
no_implicit_optional = true
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
# Below are all of the packages that don't implement stub packages. Mypy will throw an error if we don't ignore the
# missing imports. See: https://mypy.readthedocs.io/en/stable/running_mypy.html#missing-imports
module = [
    "anymarkup.*",
    "deepdiff.*",
    "dynatrace.*",
    "filetype.*",
    "hvac.*",
    "jenkins_jobs.*",
    "jsonpath_ng.*",
    "kubernetes.*",
    "networkx.*",
    "pygments.*",
    "pypd.*",
    "sendgrid.*",
    "terrascript.*",
    "yamllint.*",
]
ignore_missing_imports = true

[tool.importlinter]
# This is reconcile's own config - only contracts where reconcile is the
# subject belong here. qontract_utils/qontract_api_client own their own
# standalone-ness contracts in their own pyproject.toml; qontract_api owns
# "qontract_api must not import reconcile" in its own pyproject.toml.
#
# qontract_api is not a dependency of reconcile (ADR-007) and is therefore
# never copied into this image (see dockerfiles/Dockerfile's build-image
# stage - only reconcile, qontract_utils, qontract_api_client are COPY'd),
# so it can't be listed as a root_package here: import-linter would error
# with "Could not find package 'qontract_api' in your Python path" trying
# to introspect it. include_external_packages lets forbidden_modules
# reference it anyway, purely via import-statement matching.
root_packages = ["reconcile"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "reconcile-no-qontract-api-import"
name = "reconcile must not import qontract_api (ADR-007)"
type = "forbidden"
source_modules = ["reconcile"]
forbidden_modules = ["qontract_api"]

[[tool.importlinter.contracts]]
id = "utils-no-generated-imports"
name = "reconcile.utils must not import anything else from reconcile (APPSRE-15240)"
type = "forbidden"
source_modules = ["reconcile.utils"]
forbidden_modules = ["reconcile.*"]
# Only direct imports matter here - reconcile.utils already imports other
# reconcile/ modules (a separate, pre-existing architectural question), and those
# modules transitively import gql_definitions/typed_queries all over the place.
allow_indirect_imports = true
# Known, documented exceptions - each needs its own write-up in a future PR before
# it can be removed from this list. See APPSRE-15240 for the rationale per file.
ignore_imports = [
    # Pure dict-merge helper, no I/O - kept here deliberately, see review discussion.
    "reconcile.utils.terrascript_aws_client -> reconcile.typed_queries.aws_account_tags",
    # Vault-vs-config backend selection for the s3()/s3_ls() template helpers.
    # A parameter-threading fix was attempted here but reverted: at least 4
    # callers of process_jinja2_template() (external_resource_spec.py,
    # terrascript_aws_client.py, fleet_labeler/integration.py,
    # templating/renderer.py) don't pass settings/secret_reader down, so the
    # helpers would silently fall back to a config-file-only reader on
    # Vault-backed installations instead of raising or behaving correctly -
    # a real regression caught in review (PR #5895). Self-fetching here keeps
    # the pre-existing, correct behavior.
    "reconcile.utils.jinja2.utils -> reconcile.typed_queries.app_interface_vault_settings",
    # Lazily fetches a static custom message; moving this out would require eager
    # fetches in every TerraformClient caller or a loader-registry indirection -
    # not worth it for one log message.
    "reconcile.utils.terraform_client -> reconcile.typed_queries.app_interface_custom_messages",
    # State bucket configuration/credentials resolution - widely used (init_state is
    # called from 20+ integrations); decoupling needs a dedicated design, not a
    # reconcile.utils.** blanket exception.
    "reconcile.utils.state -> reconcile.gql_definitions.common.app_interface_state_settings",
    "reconcile.utils.state -> reconcile.typed_queries.app_interface_state_settings",
    "reconcile.utils.state -> reconcile.typed_queries.app_interface_vault_settings",
    "reconcile.utils.state -> reconcile.typed_queries.get_state_aws_account",
    # LDAP settings auto-fetch - used by 11+ membership-source consumers; must stay
    # transparent to integration business logic (see AGENTS.md), so a loader-registry
    # indirection is needed, not a simple parameter.
    "reconcile.utils.membershipsources.async_resolver -> reconcile.typed_queries.ldap_settings",
    # Queries a dynamically-configured *remote* app-interface GQL instance at
    # resolution time - no caller to move the fetch to.
    "reconcile.utils.membershipsources.app_interface_resolver -> reconcile.gql_definitions.membershipsources.roles",
    # Reconstructed from an external SQS message with a fixed field set (see
    # reconcile/utils/mr/__init__.py:init_from_sqs_message) - can't thread users
    # through the constructor.
    "reconcile.utils.mr.promote_qontract -> reconcile.typed_queries.users",
    # Vault settings for the lazy secret_reader property on the integration base
    # class, used by 50+ integrations; decoupling needs a dedicated design.
    "reconcile.utils.runtime.integration -> reconcile.typed_queries.app_interface_vault_settings",
    # Sharding strategy types/queries, deeply embedded (15+ types, isinstance
    # dispatch, direct construction); needs a dedicated refactor.
    "reconcile.utils.runtime.sharding -> reconcile.gql_definitions.integrations.integrations",
    "reconcile.utils.runtime.sharding -> reconcile.gql_definitions.sharding.aws_accounts",
    "reconcile.utils.runtime.sharding -> reconcile.gql_definitions.sharding.ocm_organization",
    "reconcile.utils.runtime.sharding -> reconcile.typed_queries.clusters_minimal",
    "reconcile.utils.runtime.sharding -> reconcile.gql_definitions.common.clusters_minimal",
    "reconcile.utils.runtime.sharding -> reconcile.gql_definitions.fragments.minimal_ocm_organization",
    # Below: direct imports from non-generated reconcile/ modules (not gql_definitions
    # or typed_queries). Broadened from the original APPSRE-15240 scope to "nothing
    # outside reconcile.utils"; each of these is a substantial integration-adjacent
    # package and needs its own dedicated decoupling design, not a quick Protocol swap.
    "reconcile.utils.mr.clusters_updates -> reconcile.change_owners.decision",
    "reconcile.utils.runtime.desired_state_diff -> reconcile.change_owners.diff",
    # Single helper function (url_makes_sense); reconcile.checkpoint is otherwise a
    # full change-owners-adjacent module.
    "reconcile.utils.jinja2.utils -> reconcile.checkpoint",
    "reconcile.utils.external_resources -> reconcile.external_resources.model",
    "reconcile.utils.openshift_resource -> reconcile.external_resources.meta",
    # get_default_config() reads local env/config, not GQL - but reconcile.github_org
    # is otherwise a full integration module.
    "reconcile.utils.jinja2.utils -> reconcile.github_org",
    "reconcile.utils.saasherder.saasherder -> reconcile.github_org",
    "reconcile.utils.terrascript_aws_client -> reconcile.github_org",
    # reconcile.queries is the legacy raw-dict GQL query module (pre-dates
    # gql_definitions/qenerate) - same underlying concern as the generated-code rule
    # above, just not caught by it since it's hand-written rather than generated.
    "reconcile.utils.jinja2.utils -> reconcile.queries",
    "reconcile.utils.membershipsources.app_interface_resolver -> reconcile.queries",
    "reconcile.utils.terrascript_aws_client -> reconcile.queries",
    "reconcile.utils.terrascript_aws_client -> reconcile.terraform_tgw_attachments",
    "reconcile.utils.terrascript_aws_client -> reconcile.terraform_users",
]
